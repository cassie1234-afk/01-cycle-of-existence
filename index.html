 function layer(buffer,type,frequency,level){let src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();src.buffer=buffer;src.loop=true;f.type=type;f.frequency.value=frequency;g.gain.value=level;src.connect(f);f.connect(g);g.connect(output);src.start();sources.push(src);return g}
 function stop(){if(timer)clearInterval(timer);timer=null;sources.forEach(s=>{try{s.stop()}catch(e){}});sources=[]}
 function set(key){current=key;if(!active||!audioSystem.isEnabled())return;init();if(!ac)return;ac.resume();stop();let p=profiles[key]||profiles.cloud,b=noise(),low=layer(b,'lowpass',p.filter,p.low),high=layer(b,'highpass',p.highFilter,p.high);output.gain.cancelScheduledValues(ac.currentTime);output.gain.setTargetAtTime(0.65,ac.currentTime,0.25);
 let phase=0;timer=setInterval(()=>{if(!ac||ac.state!=='running')return;phase+=p.rate;let t=ac.currentTime;if(key==='coast'){let swell=(Math.sin(phase)+1)/2;low.gain.setTargetAtTime(.015+swell*.15,t,.25);high.gain.setTargetAtTime(.006+swell*.055,t,.25)}else if(key==='rain'){low.gain.setTargetAtTime(.04+Math.random()*.015,t,.16);high.gain.setTargetAtTime(.055+Math.random()*.025,t,.12);if(Math.random()<.18)drop()}else if(key==='valley'){low.gain.setTargetAtTime(.012+(Math.sin(phase)+1)*.013,t,.5);high.gain.setTargetAtTime(.004+Math.random()*.009,t,.18)}},180)}
 function drop(){if(!ac||!active)return;let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime,f=550+Math.random()*700;o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.48,t+.055);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.009,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.085);o.connect(g);g.connect(output);o.start(t);o.stop(t+.09)}
 function start(){if(active)return;active=true;set(current||'cloud')}
 function sync(){if(audioSystem.isEnabled()){if(active)set(current||'cloud')}else{stop();if(ac){output.gain.value=0;ac.suspend()}}}
 return {set,start,sync};
})();
const soundButton=document.createElement('button');soundButton.id='soundToggle';soundButton.type='button';soundButton.setAttribute('aria-label','切换背景音乐与点击音效');soundButton.onclick=e=>{e.stopPropagation();audioSystem.toggle();sceneAudio.sync()};document.getElementById('top').append(soundButton);audioSystem.update();
document.addEventListener('pointerdown',e=>{if(e.target.closest('#soundToggle'))return;audioSystem.start();sceneAudio.start();if(e.target.closest('button,.tap,.polaroid,.door,.reelcard,.record,.droplet,.paperpiece,.orb,.photoObj,.drawer,.curtain,.lamp,.letter'))audioSystem.click()},true);
document.addEventListener('pointerup',e=>{if(e.target.closest('.umbrella,.bottle'))audioSystem.success()},true);
const originalGo=go;go=function(n){originalGo(n);sceneAudio.set(n===3||n===4||n===5?(['rain','coast','valley'][life]):(n===0||n===1||n===2?'cloud':'return'));if(n>0&&n!==3)audioSystem.success();document.body.dataset.route=['rain','coast','valley'][life];document.body.dataset.chapter=n};

go(0);
</script></body></html>
